[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vybz"
version = "0.1.0"
description = "A world-boss level coding workbench that is up to the time"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vybz Team", email = "vybz@orton.info" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD",
]
dependencies = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "google-genai>=1.57",  # Assuming v1.57+ syntax alignment
    "markdown-it-py>=3.0.0", 
    "python-dotenv",
    "pathspec>=0.11.0",
    "prompt_toolkit>=3.0.0", 
    "rich>=13.0",
    "PyYAML>=6.0"
]

[project.scripts]
vybz = "vybz.tools.work:main"
vybz-commit = "vybz.tools.autocommit_gen:main"
vybz-fmt = "vybz.tools.mdformat:main"

[tool.setuptools.package-data]
vybz = ["agents/*.toml", "agents/skills/*.toml", "assets/*.txt", "themes.toml"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore"
]
