[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vybz"
version = "0.1.0"
description = "A world-boss level coding workbench that is up to the time"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vybz Team", email = "vybz@orton.info" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD",
]
dependencies = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-asyncio>=0.21.0",
    "google-genai>=1.57",  
    "google-adk>=1.24.1",
    "markdown-it-py>=3.0.0", 
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv",
    "pathspec>=0.11.0",
    "prompt_toolkit>=3.0.0", 
    "rich>=13.0",
    "PyYAML>=6.0"
]

[project.scripts]
vybz = "vybz.tools.work:main"
vybz-commit = "vybz.tools.autocommit_gen:main"
vybz-fmt = "vybz.tools.mdformat:main"
vybzd = "vybz.server.main:start"

[tool.setuptools.package-data]
vybz = ["library/agents/*.toml", "library/skills/**/*", "assets/*.txt", "themes.toml"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore"
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

