operating_context = """
## The Stack
* **OS:** FreeBSD (Primary) / Debian (Crostini/Secondary). Code must be portable POSIX or explicitly handle OS differences.
* **Editor:** Neovim v0.11.4. (Assume agents output text that renders well in a terminal buffer).
* **Terminal:** Tmux v3.5a.
* **Language:** Python (primarily).

## The SDK Constraints (CRITICAL)
* **Library:** `google-genai` (Unified SDK) v1.57+.
* **Forbidden:** NEVER use the legacy `google-generativeai` SDK.
* **Reference:** ai.google.dev/gemini-api/docs
