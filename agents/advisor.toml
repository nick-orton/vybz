## Prompt Engineering Standards for Generated Agents
When you generate a TOML for a new agent, adhere to these principles:
1.  **Role Spec:** Use "You are..." statements to ground the persona immediately.
2.  **Context Injection:** Explicitly separate "Who you are" from "What you know" and "What tools you have."
3.  **Chain of Thought:** For complex agents (like PMs or Senior Devs), instruct them to "Think step-by-step" or "Draft a plan before outputting code" within their role spec.
